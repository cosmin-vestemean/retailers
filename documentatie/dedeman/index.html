<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Italy sync</title>
    <meta name="description" content="A Feathers CDB UI" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <!--load fontawesome-->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/gh/google/code-prettify@master/loader/run_prettify.js"></script>
    <style>
      body,
      span {
        font-size: 12px;
        font-family: Inter, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        font-weight: 400;
        line-height: 1.6;
        letter-spacing: 0.1px;
        color: rgb(79, 79, 79);
        vertical-align: middle;
      }
      #mainContent {
        margin-bottom: 40px;
      }
      #searchItems {
        background-color: #f5f5f5;
      }
      #footer {
        position: fixed;
        bottom: 0;
        width: 100%;
        height: 40px;
        background-color: #f5f5f5;
      }
      pre {
        white-space: pre-wrap !important;
      }
      .btn {
        border-top-left-radius: 15px;
        border-top-right-radius: 5px;
        -moz-border-radius-topleft: 10px;
        -moz-border-radius-topright: 10px;
      }
    </style>
  </head>

  <body>
    <script src="https://unpkg.com/@feathersjs/client@^5.0.0-pre.34/dist/feathers.js"></script>
    <!--load socket.io-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.1.2/socket.io.min.js"></script>
    <!--load jquery-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <!--load bootstrap-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.0.2/js/bootstrap.bundle.min.js"></script>
    <!--load xlsx-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.0/xlsx.full.min.js"></script>

    <div id="app" class="container-fluid p-1">
      <div id="header" class="d-flex flex-row sticky-top bg-white w-100 mb-2">
        <div>
          <a href="https://www.mecdiesel.ro" target="_blank">
            <img
              src="https://www.mecdiesel.ro/img/logo.png"
              alt="mecdiesel"
              width="263"
              height="58"
            />
          </a>
        </div>
        <div class="d-flex flex-column px-1">
          <button
            id="mappingsButton"
            type="button"
            class="btn btn-success shadow-sm"
          >
            Mappings <i id="mappingsReload" class="fas fa-sync"></i>
          </button>
        </div>
        <div class="d-flex flex-column px-1">
          <button id="itemsButton" class="btn btn-success shadow-sm">
            Tables <i id="itemsReload" class="fas fa-sync"></i>
          </button>
        </div>
        <div class="px-1">
          <select id="tables" class="form-select w-auto text-dark fw-bolder">
            <option value="mec_item">mec_item</option>
            <option value="mec_item_producer_relation">
              mec_item_producer_relation
            </option>
            <option value="site_product_changes_history">
              site_product_changes_history
            </option>
            <option value="site_product_frequent_changes">
              site_product_frequent_changes
            </option>
            <option value="mec_item_altref">mec_item_altref</option>
            <option value="mec_ro_item_rel_supplier">
              mec_ro_item_rel_supplier
            </option>
          </select>
          <input
            id="searchItems"
            type="text"
            class="form-control form-control-sm"
            placeholder="Search items by Item or mec_code"
          />
        </div>
        <div class="d-flex flex-column px-1">
          <button id="errorsButton" class="btn btn-success shadow-sm">
            Messages <i id="errorsReload" class="fas fa-sync"></i>
          </button>
        </div>
        <div class="d-flex flex-column px-1">
          <button id="convAutoButton" class="btn btn-success shadow-sm">
            Conversie automata <i id="convAutoReload" class="fas fa-sync"></i>
          </button>
        </div>
        <div class="d-flex flex-column px-1">
          <button id="stockChangesButton" class="btn btn-success shadow-sm">
            Stock changes <i id="stockChangesReload" class="fas fa-sync"></i>
          </button>
          <!--stockChangesReload and a checkbox side by side-->
          <div class="d-flex flex-row">
            <div class="form-check form-switch">
              <input
                class="form-check-input"
                type="checkbox"
                id="stockChangesCheckbox"
              />
              <label
                class="form-check-label fw-bold text-success"
                for="stockChangesCheckbox"
                >Out of stock</label
              >
            </div>
          </div>
        </div>
        <div class="d-flex flex-column px-1">
          <button id="batchButton" class="btn btn-primary shadow-sm">
            Batch
          </button>
          <input
            id="batchSize"
            type="number"
            class="form-control form-control-sm text-primary"
            value="50"
            style="width: 100px"
          />
        </div>
        <div class="d-flex flex-column px-1">
          <button id="printConfigButton" class="btn btn-success shadow-sm">
            Print config
          </button>
        </div>
      </div>
      <div id="mainContent" class="d-flex flex-row">
        <div id="itemsContent">
          <div>
            <table
              id="items"
              class="table table-striped table-hover table-sm table-responsive w-100"
            ></table>
          </div>
          <div id="paginationItems" class="p-1">
            <button id="firstItems" class="btn btn-success shadow-sm rounded">
              First
            </button>
            <button id="prevItems" class="btn btn-success shadow-sm rounded">
              Prev
            </button>
            <button id="nextItems" class="btn btn-success shadow-sm rounded">
              Next
            </button>
          </div>
        </div>
        <div id="mappingsContent">
          <table
            id="mappings"
            class="table table-striped table-hover table-sm table-responsive w-100"
          ></table>
          <div id="paginationMappings" class="p-1">
            <button
              id="firstMappings"
              class="btn btn-success shadow-sm rounded"
            >
              First
            </button>
            <button id="prevMappings" class="btn btn-success shadow-sm rounded">
              Prev
            </button>
            <button id="nextMappings" class="btn btn-success shadow-sm rounded">
              Next
            </button>
          </div>
        </div>
        <div id="errorsContent">
          <table
            id="errors"
            class="table table-striped table-hover table-sm table-responsive w-100"
          ></table>
          <div id="paginationErrors" class="p-1">
            <button id="firstErrors" class="btn btn-success shadow-sm rounded">
              First
            </button>
            <button id="prevErrors" class="btn btn-success shadow-sm rounded">
              Prev
            </button>
            <button id="nextErrors" class="btn btn-success shadow-sm rounded">
              Next
            </button>
          </div>
        </div>
        <div id="convAutoContent">
          <table
            id="convAuto"
            class="table table-striped table-hover table-sm table-responsive w-100"
          ></table>
          <div id="paginationConvAuto" class="p-1">
            <button
              id="firstConvAuto"
              class="btn btn-success shadow-sm rounded"
            >
              First
            </button>
            <button id="prevConvAuto" class="btn btn-success shadow-sm rounded">
              Prev
            </button>
            <button id="nextConvAuto" class="btn btn-success shadow-sm rounded">
              Next
            </button>
          </div>
        </div>
        <div id="stockChangesContent">
          <table
            id="stockChanges"
            class="table table-striped table-hover table-sm table-responsive w-100"
          ></table>
          <div id="paginationStockChanges" class="p-1">
            <button
              id="firstStockChanges"
              class="btn btn-success shadow-sm rounded"
            >
              First
            </button>
            <button
              id="prevStockChanges"
              class="btn btn-success shadow-sm rounded"
            >
              Prev
            </button>
            <button
              id="nextStockChanges"
              class="btn btn-success shadow-sm rounded"
            >
              Next
            </button>
          </div>
        </div>
        <!--
          1.batchApp: set height and width and center
        -->
        <div id="batchApp" class="vh-100 vw-100">
          <div id="batchControlPanel" class="mb-2 mt-2">
            <div
              class="btn-group"
              role="group"
              aria-label="Batch jobs radio toggle button group"
              class="d-flex flex-row"
              id="batchRadio"
            >
              <input
                type="radio"
                class="btn-check p-1"
                name="btnradio"
                id="moveItemsOnline"
                autocomplete="off"
              />
              <label
                class="btn btn-outline-primary btn-sm btn-outline-secondary me-1"
                for="moveItemsOnline"
                >Move items online</label
              >

              <input
                type="radio"
                class="btn-check p-1"
                name="btnradio"
                id="stockEvidence"
                autocomplete="off"
              />
              <label
                class="btn btn-outline-primary btn-sm btn-outline-secondary me-1"
                for="stockEvidence"
                >Stock evidence</label
              >
            </div>
            <div class="d-flex flex-row">
              <div class="p-1">
                <form id="uploadForm">
                  <input
                    id="upload"
                    type="file"
                    class="form-control form-control-sm w-100 me-1"
                    accept=".xlsx"
                  />
                </form>
              </div>
              <div class="p-1">
                <button id="process" class="btn btn-sm btn-outline-secondary">
                  Process
                </button>
              </div>
              <div class="p-1">
                <button id="stopBatch" class="btn btn-sm btn-outline-secondary">
                  Stop
                </button>
              </div>
            </div>
            <div class="d-flex flex-row">
              <span
                id="batchStatus"
                class="h5 fw-bold font-monospace text-success"
              ></span>
            </div>
          </div>
          <div class="row">
            <div id="fileContent" class="column w-25 overflow-auto vh-100">
              <table
                id="batchTable"
                class="table table-striped table-hover table-sm table-responsive mb-2"
              ></table>
            </div>
            <div
              id="batchMessagesContent"
              class="column w-75 overflow-auto vh-100 mb-2"
            >
              <span id="batchMessages"></span>
            </div>
          </div>
        </div>
        <div id="print_config">
          <script>
            //jQuery" include here content of print_config.html
            $(function () {
              $('#print_config').load('print_config.html')
            })
          </script>
        </div>
      </div>
      <!--footer-->
      <div id="footer">
        <div class="row fixed-bottom shadow-sm">
          <div class="col">
            <span class="h5 lh-lg font-monospace px-2"
              >Feathers CDB sync UI</span
            >
            <div
              class="btn-group"
              role="group"
              aria-label="Basic radio toggle button group"
            >
              <input
                type="radio"
                class="btn-check"
                name="btnradio"
                id="items50"
                autocomplete="off"
              />
              <label
                class="btn btn-outline-primary btn-sm btn-outline-secondary"
                for="items50"
                >50</label
              >

              <input
                type="radio"
                class="btn-check"
                name="btnradio"
                id="items100"
                autocomplete="off"
                checked
              />
              <label
                class="btn btn-outline-primary btn-sm btn-outline-secondary"
                for="items100"
                >100</label
              >

              <input
                type="radio"
                class="btn-check"
                name="btnradio"
                id="items200"
                autocomplete="off"
              />
              <label
                class="btn btn-outline-primary btn-sm btn-outline-secondary"
                for="items200"
                >200</label
              >

              <input
                type="radio"
                class="btn-check"
                name="btnradio"
                id="items500"
                autocomplete="off"
              />
              <label
                class="btn btn-outline-primary btn-sm btn-outline-secondary"
                for="items500"
                >500</label
              >

              <input
                type="radio"
                class="btn-check"
                name="btnradio"
                id="items1000"
                autocomplete="off"
              />
              <label
                class="btn btn-outline-primary btn-sm btn-outline-secondary"
                for="items1000"
                >1000</label
              >
            </div>
          </div>
          <div class="col">
            <!-- back to top icon from fontawesome-->
            <a href="#top" class="btn btn-outline-primary">
              <i class="fas fa-arrow-up"></i>
            </a>
            <span
              id="messages"
              class="h5 lh-lg font-monospace px-2 text-primary"
            ></span>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="client.js"></script>
  </body>
</html>
